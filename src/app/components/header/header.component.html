<div class="page-header">
  <h1 class="page-title">{{ title() }}</h1>
  <ul class="indicators">
    @for (indicator of indicators(); track indicator.label) {
      <li class="indicator">
        <span class="indicator-label">{{ indicator.label }}</span>
        <span class="indicator-value">{{ indicator.value | number }}</span>
      </li>
    }
  </ul>
</div>
