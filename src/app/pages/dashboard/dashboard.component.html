<main class="page">
  <p class="app-name">Olympic Games App</p>
  <app-header [title]="title" [indicators]="indicators"></app-header>

  @if (isLoading) {
    <p class="state-message" role="status">Loading data…</p>
  } @else if (errorMessage) {
    <div class="state-message state-message--error" role="alert">
      <p>{{ errorMessage }}</p>
      <button type="button" class="button" (click)="loadData()">Try again</button>
    </div>
  } @else if (summaries.length === 0) {
    <p class="state-message">No data available.</p>
  } @else {
    <div class="grid">
      <section class="col-main" aria-label="Pie chart of medals per country">
        <app-medals-pie-chart
          [labels]="countries"
          [values]="medals"
          (countrySelected)="onCountrySelected($event)">
        </app-medals-pie-chart>
      </section>

      <section class="col-side">
        <h2 class="section-title">Countries</h2>
        <ul class="country-list">
          @for (summary of summaries; track summary.id) {
            <li>
              <a class="country-link" [routerLink]="['/country', summary.id]">
                <span>{{ summary.country }}</span>
                <span class="country-medals">{{ summary.medals }} medals</span>
              </a>
            </li>
          }
        </ul>
      </section>
    </div>
  }
</main>
